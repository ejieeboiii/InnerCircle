plugins { id 'com.android.application' }
android {
    namespace 'com.innercircle.chat'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.innercircle.chat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('INNERCIRCLE_KEYSTORE') ?: '../release.jks')
            storePassword System.getenv('INNERCIRCLE_KEY_PASSWORD')
            keyAlias 'innercircle'
            keyPassword System.getenv('INNERCIRCLE_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
